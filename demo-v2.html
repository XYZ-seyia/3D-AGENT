<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激光切割装配编辑器 — AI+画布协作 Demo</title>
<link rel="stylesheet" href="css/demo-v2.css">
</head>
<body>

<canvas id="viewport"></canvas>
<div id="tooltip" class="tooltip"></div>

<!-- Face editor overlay -->
<div id="faceEditorOverlay" class="editor-overlay hidden">
  <div class="editor-header">
    <span id="editorTitle">面编辑器</span>
    <button id="editorClose">✕ 关闭</button>
  </div>
  <div class="editor-body">
    <canvas id="editorCanvas"></canvas>
    <div class="editor-toolbar">
      <button data-tool="circle" title="圆形镂空">○</button>
      <button data-tool="rect" title="矩形镂空">▭</button>
      <button data-tool="delete" title="删除选中">✕</button>
    </div>
    <div class="editor-actions">
      <button class="secondary" id="editorCancel">取消</button>
      <button id="editorApply">应用到 3D</button>
    </div>
  </div>
</div>

<aside id="panel">
  <section id="chatSection">
    <h3>AI 对话</h3>
    <div id="chatInput">
      <input type="text" id="chatText" placeholder="试试：做一个 200×150×100 的盒子">
      <button id="chatSend">发送</button>
    </div>
    <div id="chatLog">
      <div class="hint">支持指令：创建盒子、加隔板、去掉顶板、加镂空、换接合…</div>
    </div>
  </section>

  <section id="paramsSection">
    <h3>参数面板</h3>
    <label>长度 <span id="valLength">100</span> mm</label>
    <input type="range" id="paramLength" min="20" max="300" value="100">
    <label>宽度 <span id="valWidth">60</span> mm</label>
    <input type="range" id="paramWidth" min="20" max="300" value="60">
    <label>高度 <span id="valHeight">40</span> mm</label>
    <input type="range" id="paramHeight" min="10" max="200" value="40">
    <label>板厚 <span id="valThickness">3</span> mm</label>
    <input type="range" id="paramThickness" min="1" max="10" value="3" step="0.5">
    <label>接合 <span id="valJoint">指接榫</span></label>
    <select id="paramJoint"><option value="finger">指接榫</option><option value="tab">插榫</option></select>
    <label>爆炸图 <span id="valExplode">0</span></label>
    <input type="range" id="paramExplode" min="0" max="1" value="0" step="0.02">
  </section>

  <section id="jsonSection">
    <h3 id="jsonToggle">▼ 数据模型 JSON</h3>
    <pre id="jsonPre"></pre>
  </section>
</aside>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"}}
</script>

<script type="module" src="js/demos/demo-v2-app.js"></script>
</body>
</html>
