<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声明式架构 MVP — 盒子生成器</title>
<link rel="stylesheet" href="css/mvp-box.css">
</head>
<body>

<canvas id="viewport"></canvas>

<aside id="panel">
  <section id="chatSection">
    <h3>对话（模拟 Agent）</h3>
    <div id="chatInput">
      <input type="text" id="chatText" placeholder="例：做一个 200×150×100 的盒子，板厚 5mm，指接榫">
      <button id="chatSend">生成</button>
    </div>
    <div id="chatLog"></div>
  </section>

  <section id="paramsSection">
    <h3>参数滑块</h3>
    <label>长度 <span id="valLength">100</span> mm</label>
    <input type="range" id="paramLength" min="20" max="300" value="100">
    <label>宽度 <span id="valWidth">60</span> mm</label>
    <input type="range" id="paramWidth" min="20" max="300" value="60">
    <label>高度 <span id="valHeight">40</span> mm</label>
    <input type="range" id="paramHeight" min="10" max="200" value="40">
    <label>板厚 <span id="valThickness">3</span> mm</label>
    <input type="range" id="paramThickness" min="1" max="10" value="3" step="0.5">
    <label>接合 <span id="valJoint">指接榫</span></label>
    <select id="paramJoint">
      <option value="finger">指接榫</option>
      <option value="tab">卡舌卡槽</option>
    </select>
    <label>爆炸图 <span id="valExplode">0</span></label>
    <input type="range" id="paramExplode" min="0" max="1" value="0" step="0.05">
    <div class="override">
      <h4>微调（设计师 override）</h4>
      <label>位置偏移 Y <span id="valOffsetY">0</span></label>
      <input type="range" id="overrideOffsetY" min="-30" max="30" value="0">
    </div>
  </section>

  <section id="jsonSection">
    <h3 id="jsonToggle">▼ 数据模型 JSON</h3>
    <pre id="jsonPre"></pre>
  </section>
</aside>

<script>
if (location.protocol === 'file:') {
  window.addEventListener('DOMContentLoaded', () => {
    const note = document.createElement('div');
    note.style.cssText = 'position:fixed;top:12px;left:12px;right:12px;z-index:9999;padding:12px 14px;border-radius:10px;background:rgba(255,190,92,.96);color:#201400;font:12px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25)';
    note.innerHTML = '当前是通过 <b>file://</b> 直接打开。这个页面现在依赖 <code>js/core</code> 本地模块，请改用本地静态服务器访问，例如：<code>python3 -m http.server 8123</code>，然后打开 <code>http://127.0.0.1:8123/mvp-box-demo.html</code>。';
    document.body.appendChild(note);
  });
}
</script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"}}
</script>

<script type="module" src="js/demos/mvp-box-app.js"></script>
</body>
</html>
