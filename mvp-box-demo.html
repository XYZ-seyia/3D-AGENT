<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声明式架构 MVP — 盒子生成器</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;overflow:hidden;height:100vh;display:flex}
#viewport{flex:0 0 70%;position:relative;min-width:0}
#panel{flex:0 0 30%;max-width:360px;display:flex;flex-direction:column;background:rgba(22,22,44,.95);border-left:1px solid rgba(255,255,255,.08);overflow:hidden}
#chatSection{padding:12px;border-bottom:1px solid rgba(255,255,255,.08)}
#chatSection h3{font-size:12px;color:#888;margin-bottom:8px;text-transform:uppercase}
#chatInput{display:flex;gap:8px;margin-bottom:8px}
#chatInput input{flex:1;background:#2a2a4a;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;color:#e0e0e0;font-size:13px;outline:none}
#chatInput input::placeholder{color:#666}
#chatInput button{background:#4fc3f7;color:#1a1a2e;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
#chatInput button:hover{background:#81d4fa}
#chatLog{max-height:120px;overflow-y:auto;font-size:12px;color:#aaa;line-height:1.5}
#chatLog .agent{color:#81c784}
#chatLog .user{color:#90caf9}
#paramsSection{padding:12px;border-bottom:1px solid rgba(255,255,255,.08);overflow-y:auto}
#paramsSection h3{font-size:12px;color:#888;margin-bottom:10px;text-transform:uppercase}
#paramsSection label{display:block;font-size:11px;color:#aaa;margin-top:8px}
#paramsSection input[type="range"]{width:100%;margin-top:2px;-webkit-appearance:none;height:4px;background:#444;border-radius:2px}
#paramsSection input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#4fc3f7;cursor:pointer}
#paramsSection .override{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.1)}
#paramsSection .override h4{font-size:11px;color:#666;margin-bottom:6px}
#jsonSection{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px}
#jsonSection h3{font-size:12px;color:#888;margin-bottom:8px;text-transform:uppercase;cursor:pointer;user-select:none}
#jsonSection h3:hover{color:#aaa}
#jsonPre{flex:1;min-height:80px;overflow:auto;background:#0d0d1a;border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:10px;font-size:11px;font-family:monospace;line-height:1.4;white-space:pre-wrap;word-break:break-all}
#jsonPre .key{color:#9cdcfe}
#jsonPre .str{color:#ce9178}
#jsonPre .num{color:#b5cea8}
#jsonPre .hl-prim{background:rgba(129,199,132,.15)}
#jsonPre .hl-over{background:rgba(255,204,128,.15)}
</style>
</head>
<body>

<canvas id="viewport"></canvas>

<aside id="panel">
  <section id="chatSection">
    <h3>对话（模拟 Agent）</h3>
    <div id="chatInput">
      <input type="text" id="chatText" placeholder="例：做一个 200×150×100 的盒子，板厚 5mm，指接榫">
      <button id="chatSend">生成</button>
    </div>
    <div id="chatLog"></div>
  </section>

  <section id="paramsSection">
    <h3>参数滑块</h3>
    <label>长度 <span id="valLength">100</span> mm</label>
    <input type="range" id="paramLength" min="20" max="300" value="100">
    <label>宽度 <span id="valWidth">60</span> mm</label>
    <input type="range" id="paramWidth" min="20" max="300" value="60">
    <label>高度 <span id="valHeight">40</span> mm</label>
    <input type="range" id="paramHeight" min="10" max="200" value="40">
    <label>板厚 <span id="valThickness">3</span> mm</label>
    <input type="range" id="paramThickness" min="1" max="10" value="3" step="0.5">
    <label>接合 <span id="valJoint">指接榫</span></label>
    <select id="paramJoint">
      <option value="finger">指接榫</option>
      <option value="tab">插榫</option>
    </select>
    <label>爆炸图 <span id="valExplode">0</span></label>
    <input type="range" id="paramExplode" min="0" max="1" value="0" step="0.05">
    <div class="override">
      <h4>微调（设计师 override）</h4>
      <label>位置偏移 Y <span id="valOffsetY">0</span></label>
      <input type="range" id="overrideOffsetY" min="-30" max="30" value="0">
    </div>
  </section>

  <section id="jsonSection">
    <h3 id="jsonToggle">▼ 数据模型 JSON</h3>
    <pre id="jsonPre"></pre>
  </section>
</aside>

<script>
if (location.protocol === 'file:') {
  window.addEventListener('DOMContentLoaded', () => {
    const note = document.createElement('div');
    note.style.cssText = 'position:fixed;top:12px;left:12px;right:12px;z-index:9999;padding:12px 14px;border-radius:10px;background:rgba(255,190,92,.96);color:#201400;font:12px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25)';
    note.innerHTML = '当前是通过 <b>file://</b> 直接打开。这个页面现在依赖 <code>js/core</code> 本地模块，请改用本地静态服务器访问，例如：<code>python3 -m http.server 8123</code>，然后打开 <code>http://127.0.0.1:8123/mvp-box-demo.html</code>。';
    document.body.appendChild(note);
  });
}
</script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createModel } from './js/core/schema.js';
import { updatePrimitiveParams, setOverride } from './js/core/model-ops.js';
import { compileModelToAssembly } from './js/core/macro-models.js';
import { renderAssembly, setExplodeFactor } from './js/core/assembly-renderer.js';

// ═══════════════════════════════════════════════════════════════════════════
// 1. 数据模型层（js/core schema + model-ops）
// ═══════════════════════════════════════════════════════════════════════════

let model = createModel({
  primitives: [{
    id: 'box_1',
    primitive: 'box',
    params: { length: 100, width: 60, height: 40, thickness: 3 },
    joints: { type: 'finger' },
  }],
  meta: { name: '基础盒子', source: 'initial' },
});
model.primitives[0].joints = { type: 'finger' };
let lastChangeSource = null; // 'agent' | 'slider' | null

function setByPath(obj, path, value) {
  const parts = path.replace(/^\./, '').split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = parts[i];
    const nextKey = parts[i + 1];
    const isIndex = /^\d+$/.test(nextKey);
    if (!(key in cur)) cur[key] = isIndex ? [] : {};
    cur = cur[key];
  }
  cur[parts[parts.length - 1]] = value;
}

function getByPath(obj, path) {
  let cur = obj;
  for (const key of path.replace(/^\./, '').split('.')) {
    cur = cur?.[key];
  }
  return cur;
}

function updateModel(path, value, source) {
  lastChangeSource = source || null;
  setByPath(model, path, value);
  onChange();
}

function onChange() {
  if (typeof window.onModelChange === 'function') window.onModelChange(model, lastChangeSource);
}

// ═══════════════════════════════════════════════════════════════════════════
// 2. 渲染（js/core macro-models + assembly-renderer）
// ═══════════════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════════════
// 3. Mock Agent 解析器
// ═══════════════════════════════════════════════════════════════════════════

function parseNaturalLanguage(text) {
  const result = { length: 100, width: 60, height: 40, thickness: 3, jointType: 'finger' };
  const num = /(\d+(?:\.\d+)?)\s*(?:mm|厘米|cm)?/gi;
  const numbers = [];
  let match;
  while ((match = num.exec(text)) !== null) numbers.push(parseFloat(match[1]));

  if (text.includes('×') || text.includes('x') || text.includes('*')) {
    const parts = text.split(/[×x*]/).map(s => parseFloat(s.replace(/[^\d.]/g, ''))).filter(n => !isNaN(n) && n > 0);
    if (parts.length >= 3) {
      result.length = Math.min(300, Math.max(20, parts[0]));
      result.width = Math.min(300, Math.max(20, parts[1]));
      result.height = Math.min(200, Math.max(10, parts[2]));
    } else if (parts.length === 2) {
      result.length = Math.min(300, Math.max(20, parts[0]));
      result.width = Math.min(300, Math.max(20, parts[1]));
    }
  }
  if (numbers.length >= 1 && (text.includes('板厚') || text.includes('厚度'))) {
    const t = numbers[numbers.length - 1];
    if (t >= 1 && t <= 10) result.thickness = t;
  }
  if (numbers.length >= 3 && !text.includes('板厚') && !text.includes('厚度')) {
    const a = numbers[numbers.length - 3];
    const b = numbers[numbers.length - 2];
    const c = numbers[numbers.length - 1];
    if (a >= 20 && a <= 300 && b >= 20 && b <= 300 && c >= 10 && c <= 200) {
      result.length = a;
      result.width = b;
      result.height = c;
    }
  }
  if (/插榫|卡槽|tab/i.test(text)) result.jointType = 'tab';
  if (/指接|手指|finger/i.test(text)) result.jointType = 'finger';
  return result;
}

function replyFromParse(parsed) {
  const j = parsed.jointType === 'tab' ? '插榫' : '指接榫';
  return `已生成 ${parsed.length}×${parsed.width}×${parsed.height} mm 盒子，板厚 ${parsed.thickness} mm，${j}。`;
}

// ═══════════════════════════════════════════════════════════════════════════
// 4. 场景与 UI 绑定
// ═══════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.setClearColor(0x1a1a2e);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
camera.position.set(120, 100, 160);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(60, 100, 80);
scene.add(dir);
scene.add(new THREE.GridHelper(400, 40, 0x333355, 0x222244));

let boxGroup = null;
let explodeFactor = 0;

function renderScene() {
  if (boxGroup) {
    scene.remove(boxGroup);
    boxGroup.traverse(c => {
      if (c.geometry) c.geometry.dispose();
      if (c.material && !Array.isArray(c.material)) c.material.dispose();
    });
  }
  const assembly = compileModelToAssembly(model);
  boxGroup = renderAssembly(assembly);
  scene.add(boxGroup);
  setExplodeFactor(boxGroup, explodeFactor, 50);
}

function syncSlidersFromModel() {
  const p = model.primitives?.[0]?.params;
  if (!p) return;
  document.getElementById('paramLength').value = p.length;
  document.getElementById('paramWidth').value = p.width;
  document.getElementById('paramHeight').value = p.height;
  document.getElementById('paramThickness').value = p.thickness;
  document.getElementById('valLength').textContent = p.length;
  document.getElementById('valWidth').textContent = p.width;
  document.getElementById('valHeight').textContent = p.height;
  document.getElementById('valThickness').textContent = p.thickness;
  const joint = model.primitives?.[0]?.joints?.type || 'finger';
  document.getElementById('paramJoint').value = joint;
  document.getElementById('valJoint').textContent = joint === 'tab' ? '插榫' : '指接榫';
  const ov = model.overrides?.['box_1:front']?.position_offset;
  const oy = (ov && ov[1]) ?? 0;
  document.getElementById('overrideOffsetY').value = oy;
  document.getElementById('valOffsetY').textContent = oy;
}

function updateJSONViewer(source) {
  const pre = document.getElementById('jsonPre');
  const raw = JSON.stringify(model, null, 2);
  if (!pre.dataset.raw || pre.dataset.raw !== raw) {
    pre.dataset.raw = raw;
    let html = escapeHtml(raw)
      .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
      .replace(/: "([^"]*)"/g, (_, s) => ': <span class="str">"' + escapeHtml(s) + '"</span>')
      .replace(/: (\d+(?:\.\d+)?)/g, ': <span class="num">$1</span>');
    pre.innerHTML = html;
    if (source === 'agent') {
      pre.querySelectorAll('.key').forEach(el => { if (el.textContent === '"primitives"') el.classList.add('hl-prim'); });
    } else if (source === 'slider') {
      pre.querySelectorAll('.key').forEach(el => { if (el.textContent === '"overrides"') el.classList.add('hl-over'); });
    }
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

window.onModelChange = function(m, source) {
  renderScene();
  syncSlidersFromModel();
  updateJSONViewer(source);
};

document.getElementById('chatSend').addEventListener('click', () => {
  const input = document.getElementById('chatText');
  const text = (input.value || '').trim();
  if (!text) return;
  const chatLog = document.getElementById('chatLog');
  chatLog.innerHTML += '<div class="user">你：' + escapeHtml(text) + '</div>';
  const parsed = parseNaturalLanguage(text);
  updateModel('primitives.0.params.length', parsed.length, 'agent');
  updateModel('primitives.0.params.width', parsed.width, 'agent');
  updateModel('primitives.0.params.height', parsed.height, 'agent');
  updateModel('primitives.0.params.thickness', parsed.thickness, 'agent');
  updateModel('primitives.0.joints.type', parsed.jointType, 'agent');
  updateModel('meta.source', 'agent', 'agent');
  chatLog.innerHTML += '<div class="agent">Agent：' + escapeHtml(replyFromParse(parsed)) + '</div>';
  chatLog.scrollTop = chatLog.scrollHeight;
  input.value = '';
});

document.getElementById('chatText').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('chatSend').click();
});

document.getElementById('paramLength').addEventListener('input', e => {
  const v = Number(e.target.value);
  document.getElementById('valLength').textContent = v;
  updatePrimitiveParams(model, 'box_1', { length: v });
  lastChangeSource = 'slider';
  onChange();
});
document.getElementById('paramWidth').addEventListener('input', e => {
  const v = Number(e.target.value);
  document.getElementById('valWidth').textContent = v;
  updatePrimitiveParams(model, 'box_1', { width: v });
  lastChangeSource = 'slider';
  onChange();
});
document.getElementById('paramHeight').addEventListener('input', e => {
  const v = Number(e.target.value);
  document.getElementById('valHeight').textContent = v;
  updatePrimitiveParams(model, 'box_1', { height: v });
  lastChangeSource = 'slider';
  onChange();
});
document.getElementById('paramThickness').addEventListener('input', e => {
  const v = Number(e.target.value);
  document.getElementById('valThickness').textContent = v;
  updatePrimitiveParams(model, 'box_1', { thickness: v });
  lastChangeSource = 'slider';
  onChange();
});
document.getElementById('paramJoint').addEventListener('change', e => {
  const v = e.target.value;
  document.getElementById('valJoint').textContent = v === 'tab' ? '插榫' : '指接榫';
  if (!model.primitives[0].joints) model.primitives[0].joints = {};
  model.primitives[0].joints.type = v;
  lastChangeSource = 'slider';
  onChange();
});

const BOX_PANEL_KEYS = ['front', 'back', 'left', 'right', 'top', 'bottom'];
document.getElementById('overrideOffsetY').addEventListener('input', e => {
  const v = Number(e.target.value);
  document.getElementById('valOffsetY').textContent = v;
  for (const key of BOX_PANEL_KEYS) {
    setOverride(model, `box_1:${key}`, { position_offset: [0, v, 0] });
  }
  lastChangeSource = 'slider';
  onChange();
});

document.getElementById('paramExplode').addEventListener('input', e => {
  explodeFactor = Number(e.target.value);
  document.getElementById('valExplode').textContent = explodeFactor.toFixed(2);
  if (boxGroup) setExplodeFactor(boxGroup, explodeFactor);
});

document.getElementById('jsonToggle').addEventListener('click', () => {
  const pre = document.getElementById('jsonPre');
  pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
});

function onResize() {
  const canvas = document.getElementById('viewport');
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (canvas.width !== width || canvas.height !== height) {
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
}

window.addEventListener('resize', onResize);
onResize();

renderScene();
syncSlidersFromModel();
updateJSONViewer(null);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
